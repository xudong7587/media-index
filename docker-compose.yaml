services:
  media-index:
    image: ghcr.io/xudong7587/media-index:latest
    pull_policy: always
    container_name: media-index
    ports:
      # 管理面板；左侧端口可按 NAS 实际规划修改。
      - "8000:8000"
      # STRM/302 播放入口；不要把反向代理的播放域名指向管理端口。
      - "8097:8097"
    environment:
      # 启动前请修改用户名和密码，应用会拒绝空密码以及密码 admin。
      MEDIA_USER: admin
      MEDIA_PASS: change-this-password
      # PanSou 地址及其他设置在网页设置页面填写，并自动保存到 ./data/.env。
      MEDIA_CONFIG_PATH: /app/data/.env
      STATIC_DIR: /app/frontend
      DB_PATH: /app/data/media_index.db
      CACHE_DIR: /app/data/cache
      STRM_OUTPUT_ROOT: /strm
      MEDIA_PLAYBACK_INTERNAL_PORT: 8097
      # 可选网络代理。也可启动后在“系统设置 → 网络代理”填写；网页保存值优先。
      # 代理位于局域网时必须使用 NAS/容器可访问的内网 IP，且代理端开启允许局域网连接。
      PROXY_URL: ${PROXY_URL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,media-index,pansou,quark-auto-save,openlist}
      # 如 NAS 目录有指定所属用户，可在 Compose .env 中覆盖。
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    volumes:
      - ./data:/app/data
      - ./downloads:/downloads
      # 将 NAS 中供 Emby 扫描的 STRM 目录挂载到容器 /strm。
      - ./strm:/strm
    restart: unless-stopped

  # 可选：PanSou 搜索服务。首次使用时删除本服务和文末 pansou-cache 定义的“# ”即可启用。
  # 启用后，在 MediaIndex 管理面板填写 PanSou 地址：http://pansou:8888
  # pansou:
  #   image: ghcr.io/fish2018/pansou:latest
  #   pull_policy: always
  #   container_name: pansou
  #   ports:
  #     - "8888:8888"
  #   environment:
  #     PORT: 8888
  #     CACHE_ENABLED: "true"
  #     CACHE_PATH: /app/cache
  #     CACHE_TTL: 60
  #     HTTP_PROXY: ${HTTP_PROXY:-}
  #     HTTPS_PROXY: ${HTTPS_PROXY:-}
  #     NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,media-index,pansou}
  #   volumes:
  #     - pansou-cache:/app/cache
  #   restart: unless-stopped

# 可选 PanSou 缓存卷；启用上方 pansou 服务时一并取消注释。
# volumes:
#   pansou-cache:
